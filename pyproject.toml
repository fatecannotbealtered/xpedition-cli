# Build configuration. The package name, the version and the command name come from
# package.json (DREPO-053); check_project compares the version below with it.
[project]
name = "xpedition_cli"
version = "1.6.0"
description = "Lets an AI Agent operate Xpedition safely from the command line."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pywin32>=311; sys_platform == 'win32'", "pywinauto>=0.6.9; sys_platform == 'win32'"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["xpedition_cli/_driver"]
