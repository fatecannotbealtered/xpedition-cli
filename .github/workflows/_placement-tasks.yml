name: Apply and verify selected placement tasks
on:
  push:
    branches: [codex/selected-placement-tasks-20260918]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/selected-placement-tasks-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Demonstrate missing command behavior before integration
        run: |
          set +e
          pytest -q tests/test_placement_cli.py -k 'offline_plan or batch_write_roundtrip or release_readiness' --junitxml=/tmp/placement-before.xml > /tmp/placement-before.txt 2>&1
          STATUS=$?
          tail -40 /tmp/placement-before.txt
          test "$STATUS" -eq 1
      - name: Apply source-pinned integration and format touched code
        run: |
          python scripts/_placement_patch.py
          ruff check --select I --fix xpedition_cli/main.py xpedition_cli/reference_data.py xpedition_cli/native_com_adapter.py xpedition_cli/backends/native_xpedition.py xpedition_cli/*placement*.py tests/test_*placement*.py
          ruff format xpedition_cli/main.py xpedition_cli/reference_data.py xpedition_cli/native_com_adapter.py xpedition_cli/backends/native_xpedition.py xpedition_cli/*placement*.py tests/test_*placement*.py
      - name: Run full suite and unchanged quality guards
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q --junitxml=/tmp/placement-after.xml | tee /tmp/placement-after.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
      - name: Build binary and smoke offline placement entry point
        run: |
          python build.py > /tmp/placement-build.txt 2>&1
          dist/xpedition-cli pcb placement-plan --file examples/placement-task.json --input examples/placement-observations.json --compact > /tmp/placement-binary.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/placement-binary.json').read_text())
          assert value['ok'] and value['data']['summary']['selected_count'] == 3
          assert value['data']['validation']['native_smoke'] == 'missing'
          PY
      - name: Record actual test evidence
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          def counts(file):
              suites = list(ET.parse(file).getroot().iter('testsuite'))
              return {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          paths = list(Path('xpedition_cli').glob('*placement*.py')) + list(Path('tests').glob('test_*placement*.py'))
          paths += [Path('xpedition_cli/main.py'),Path('xpedition_cli/native_com_adapter.py'),Path('xpedition_cli/reference_data.py')]
          data = {'baseline':'8e40dc910b09e5f0ca58b975739bc4bba7cef031','dependency_pr':7,
                  'run_id':os.environ['GITHUB_RUN_ID'],'python':sys.version,'platform':platform.platform(),
                  'baseline_selected':counts('/tmp/placement-before.xml'),'full_suite':counts('/tmp/placement-after.xml'),
                  'ruff':'passed','version_sync':'passed','contract_local_only':'passed',
                  'linux_pyinstaller_offline_smoke':'passed','native_xpedition_executed':False,
                  'source_sha256':{p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}}
          Path('docs/PLACEMENT_TASKS_VALIDATION.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Retain raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: placement-task-evidence
          path: |
            /tmp/placement-before.txt
            /tmp/placement-before.xml
            /tmp/placement-after.txt
            /tmp/placement-after.xml
            /tmp/placement-build.txt
            /tmp/placement-binary.json
      - name: Commit verified implementation only on this branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/selected-placement-tasks-20260918'
          rm scripts/_placement_patch.py .github/workflows/_placement-tasks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat: add verified selected-origin placement tasks with native safety boundaries'
          git push origin HEAD:refs/heads/codex/selected-placement-tasks-20260918
