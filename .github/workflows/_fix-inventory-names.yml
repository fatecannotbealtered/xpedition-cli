name: Verify actual Windows metadata binding
on:
  push:
    branches: [codex/readonly-api-inventory-20260918]
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/readonly-api-inventory-20260918'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: python -m pip install -e '.[dev]' 'pywin32>=306'
      - name: Correct binding signatures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_fix_inventory_names.py
          ruff check --select I --fix xpedition_cli/api_inventory.py tests/test_api_inventory.py
          ruff format xpedition_cli/api_inventory.py tests/test_api_inventory.py
      - name: Full tests and actual Windows OLE metadata
        shell: bash
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q --junitxml=binding-windows.xml | tee binding-windows-tests.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
          python scripts/smoke-api-inventory.py
          python - <<'PY'
          import hashlib, json, os, platform, xml.etree.ElementTree as ET
          from pathlib import Path
          rows = list(ET.parse('binding-windows.xml').getroot().iter('testsuite'))
          summary = json.loads(Path('inventory-smoke/summary.json').read_text())
          assert summary['status'] == 'passed' and not summary['xpedition_executed']
          data = {'run_id': os.environ['GITHUB_RUN_ID'], 'platform': platform.platform(),
                  'full_suite': {k: sum(int(s.get(k, 0)) for s in rows) for k in ('tests','failures','errors','skipped')},
                  'ruff': 'passed', 'version_sync': 'passed', 'contract_local_only': 'passed',
                  'windows_metadata_smoke': summary, 'xpedition_executed': False,
                  'source_sha256_normalized_lf': hashlib.sha256(Path('xpedition_cli/api_inventory.py').read_text(encoding='utf-8').encode()).hexdigest()}
          Path('docs/API_INVENTORY_WINDOWS_VALIDATION.json').write_text(json.dumps(data, indent=2)+'\n', encoding='utf-8', newline='\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-inventory-real-binding-evidence
          path: |
            binding-windows.xml
            binding-windows-tests.txt
            inventory-smoke/*.json
      - name: Commit verified code only on the review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/readonly-api-inventory-20260918'
          rm scripts/_fix_inventory_names.py .github/workflows/_fix-inventory-names.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xpedition_cli/api_inventory.py tests/test_api_inventory.py docs/API_INVENTORY_DESIGN.md docs/API_INVENTORY_WINDOWS_VALIDATION.json
          git add -u scripts/_fix_inventory_names.py .github/workflows/_fix-inventory-names.yml
          git diff --cached --check
          git commit -m 'fix: align metadata signatures and validate against real Windows OLE types'
          git push origin HEAD:refs/heads/codex/readonly-api-inventory-20260918
