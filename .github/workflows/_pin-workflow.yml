name: Verify offline pin assignment workflows
on:
  push:
    branches: [codex/pin-assignment-workflow-20260918]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/pin-assignment-workflow-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: python -m pip install -e '.[dev]'
      - name: Prove the new CLI workflows are absent on baseline
        run: |
          set +e
          pytest -q tests/test_pin_assignment_cli.py -k offline_queries --junitxml=/tmp/pins-before.xml > /tmp/pins-before.txt 2>&1
          STATUS=$?
          tail -35 /tmp/pins-before.txt
          test "$STATUS" -eq 1
      - name: Apply exact-source patch
        run: |
          python scripts/_pin_workflow_patch.py
          ruff check --select I --fix xpedition_cli/main.py xpedition_cli/reference_data.py xpedition_cli/pin_assignment.py xpedition_cli/pin_assignment_contract.py tests/test_pin_assignment.py tests/test_pin_assignment_cli.py
          ruff format xpedition_cli/main.py xpedition_cli/reference_data.py xpedition_cli/pin_assignment.py xpedition_cli/pin_assignment_contract.py tests/test_pin_assignment.py tests/test_pin_assignment_cli.py
      - name: Run unchanged quality gates and all tests
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q --junitxml=/tmp/pins-after.xml | tee /tmp/pins-after.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
          python -m xpedition_cli.main schematic pin-plan --input examples/pin-assignment-snapshot.json --file examples/pin-assignments.csv --compact > /tmp/pin-plan.json
          python -m xpedition_cli.main schematic pin-check --input examples/pin-assignment-snapshot.json --file examples/pin-assignments.csv --compact > /tmp/pin-check.json
          python - <<'PY'
          import hashlib, json, os, platform, xml.etree.ElementTree as ET
          from pathlib import Path
          def counts(path):
              suites = ET.parse(path).getroot().iter('testsuite')
              rows = list(suites)
              return {k: sum(int(s.get(k, 0)) for s in rows) for k in ('tests','failures','errors','skipped')}
          plan = json.loads(Path('/tmp/pin-plan.json').read_text())
          check = json.loads(Path('/tmp/pin-check.json').read_text())
          assert plan['ok'] and plan['data']['valid']
          assert check['ok'] and check['data']['matches'] is False
          data = {'baseline': 'd42b226a5b1812b2937ded096bf618b8692c4f9a', 'run_id': os.environ['GITHUB_RUN_ID'],
                  'platform': platform.platform(), 'before': counts('/tmp/pins-before.xml'),
                  'full_suite': counts('/tmp/pins-after.xml'), 'ruff': 'passed', 'version_sync': 'passed',
                  'contract_local_only': 'passed', 'native_xpedition_executed': False,
                  'scope': 'offline comparison of supplied observations; not native execution',
                  'source_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in
                    [Path('xpedition_cli/pin_assignment.py'), Path('xpedition_cli/pin_assignment_contract.py'),
                     Path('xpedition_cli/main.py'), Path('xpedition_cli/reference_data.py')]}}
          Path('docs/PIN_WORKFLOW_VALIDATION.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Retain regression and CLI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pin-workflow-evidence
          path: |
            /tmp/pins-*.txt
            /tmp/pins-*.xml
            /tmp/pin-plan.json
            /tmp/pin-check.json
      - name: Commit verified implementation only on work branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/pin-assignment-workflow-20260918'
          rm scripts/_pin_workflow_patch.py .github/workflows/_pin-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat: plan and check exact pin assignments against saved observations'
          git push origin HEAD:refs/heads/codex/pin-assignment-workflow-20260918
