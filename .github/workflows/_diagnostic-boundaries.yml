name: Apply and verify diagnostic boundaries
on:
  push:
    branches: [codex/diagnostic-backend-boundaries-20260917]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/diagnostic-backend-boundaries-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Reproduce the regression on the unchanged source
        run: |
          set +e
          pytest -q tests/test_diagnostic_boundaries.py > /tmp/diagnostic-before.txt 2>&1
          STATUS=$?
          tail -40 /tmp/diagnostic-before.txt
          test "$STATUS" -eq 1
      - name: Apply the pinned-source patch
        run: |
          python scripts/_diagnostic_boundaries_patch.py
          ruff check --select I --fix xpedition_cli/main.py tests/test_diagnostic_boundaries.py
          ruff format xpedition_cli/main.py tests/test_diagnostic_boundaries.py
      - name: Run all tests and guards
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q --junitxml=/tmp/diagnostic-junit.xml | tee /tmp/diagnostic-tests.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          suites = list(ET.parse('/tmp/diagnostic-junit.xml').getroot().iter('testsuite'))
          data = {'baseline': 'd42b226a5b1812b2937ded096bf618b8692c4f9a',
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'tests': sum(int(s.get('tests', 0)) for s in suites),
                  'failures': sum(int(s.get('failures', 0)) for s in suites),
                  'errors': sum(int(s.get('errors', 0)) for s in suites),
                  'skipped': sum(int(s.get('skipped', 0)) for s in suites),
                  'ruff': 'passed', 'version_sync': 'passed', 'contract_local_only': 'passed',
                  'native_xpedition_executed': False}
          Path('docs/DIAGNOSTIC_BOUNDARIES_VALIDATION.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-boundaries-evidence
          path: |
            /tmp/diagnostic-before.txt
            /tmp/diagnostic-tests.txt
            /tmp/diagnostic-junit.xml
      - name: Commit only on this review branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/diagnostic-backend-boundaries-20260917'
          rm scripts/_diagnostic_boundaries_patch.py .github/workflows/_diagnostic-boundaries.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix(agent): reject unsupported native analysis and avoid capability project loads'
          git push origin HEAD:refs/heads/codex/diagnostic-backend-boundaries-20260917
