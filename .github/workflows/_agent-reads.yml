name: Apply and verify scoped reference and bounded reads
on:
  push:
    branches: [codex/scoped-reference-bounded-reads-20260917]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/scoped-reference-bounded-reads-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install the existing development toolchain
        run: python -m pip install -e '.[dev]'
      - name: Reproduce missing behavior on the pinned baseline
        run: |
          set +e
          pytest -q tests/test_reference_query.py tests/test_query_page.py > /tmp/agent-reads-before.txt 2>&1
          STATUS=$?
          tail -60 /tmp/agent-reads-before.txt
          test "$STATUS" -eq 1
      - name: Apply source-pinned patch
        run: python scripts/_agent_reads_patch.py
      - name: Format only changed files
        run: |
          ruff check --select I --fix xpedition_cli/main.py xpedition_cli/reference_data.py xpedition_cli/reference_query.py xpedition_cli/query_page.py tests/test_reference_query.py tests/test_query_page.py scripts/benchmark-agent-reads.py
          ruff format xpedition_cli/main.py xpedition_cli/reference_data.py xpedition_cli/reference_query.py xpedition_cli/query_page.py tests/test_reference_query.py tests/test_query_page.py scripts/benchmark-agent-reads.py
      - name: Run the complete test suite and guards
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests scripts/benchmark-agent-reads.py
          ruff format --check xpedition_cli tests scripts/benchmark-agent-reads.py
          pytest -q --junitxml=/tmp/agent-reads-junit.xml | tee /tmp/agent-reads-tests.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
      - name: Record synthetic measurement and validation evidence
        run: |
          set -euo pipefail
          python scripts/benchmark-agent-reads.py | tee docs/AGENT_READS_METRICS.json
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('/tmp/agent-reads-junit.xml').getroot()
          suites = list(root.iter('testsuite'))
          data = {
              'baseline': 'd42b226a5b1812b2937ded096bf618b8692c4f9a',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'tests': sum(int(s.get('tests', 0)) for s in suites),
              'failures': sum(int(s.get('failures', 0)) for s in suites),
              'errors': sum(int(s.get('errors', 0)) for s in suites),
              'skipped': sum(int(s.get('skipped', 0)) for s in suites),
              'ruff': 'passed', 'version_sync': 'passed', 'contract_local_only': 'passed',
              'native_xpedition_executed': False,
              'note': 'No main merge or release; independent PR CI validates the committed tree.',
          }
          Path('docs/AGENT_READS_VALIDATION.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Retain the raw test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoped-reference-bounded-reads-evidence
          path: |
            /tmp/agent-reads-before.txt
            /tmp/agent-reads-tests.txt
            /tmp/agent-reads-junit.xml
            docs/AGENT_READS_METRICS.json
            docs/AGENT_READS_VALIDATION.json
      - name: Commit verified changes on the review branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/scoped-reference-bounded-reads-20260917'
          rm scripts/_agent_reads_patch.py .github/workflows/_agent-reads.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat(agent): scoped reference discovery and bounded local query pages'
          git push origin HEAD:refs/heads/codex/scoped-reference-bounded-reads-20260917
