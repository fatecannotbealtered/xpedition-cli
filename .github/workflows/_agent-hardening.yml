name: Apply and verify isolated agent hardening
on:
  push:
    branches: [codex/agent-hardening-20260917]
permissions:
  contents: write
jobs:
  hardening:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/agent-hardening-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Reproduce regressions before patching
        run: |
          set +e
          pytest -q tests/test_agent_hardening.py tests/test_routing_incremental.py > /tmp/hardening-before.txt 2>&1
          STATUS=$?
          cat /tmp/hardening-before.txt
          test "$STATUS" -eq 1
      - name: Apply exact pinned-source patch
        run: |
          python scripts/_agent_hardening_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('xpedition_cli/reference_data.py')
          text = p.read_text(encoding='utf-8')
          old = '"description": "comma-separated data paths; arrays project per item (items.refdes or items[].refdes); pagination and _untrusted are retained",'
          new = '"description": (\n                    "Comma-separated data paths, including items.refdes or items[].refdes; "\n                    "pagination and _untrusted are retained."\n                ),'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format changed Python files and sort their imports
        run: |
          ruff check --select I --fix xpedition_cli/main.py xpedition_cli/output.py xpedition_cli/reference_data.py xpedition_cli/routing_plan.py xpedition_cli/field_projection.py xpedition_cli/native_verification.py tests/test_agent_hardening.py tests/test_field_projection.py tests/test_native_verification.py tests/test_routing_incremental.py scripts/benchmark-routing.py
          ruff format xpedition_cli/main.py xpedition_cli/output.py xpedition_cli/reference_data.py xpedition_cli/routing_plan.py xpedition_cli/field_projection.py xpedition_cli/native_verification.py tests/test_agent_hardening.py tests/test_field_projection.py tests/test_native_verification.py tests/test_routing_incremental.py scripts/benchmark-routing.py
      - name: Run all tests and quality guards
        run: |
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
      - name: Compare correctness and synthetic scaling
        run: python scripts/benchmark-routing.py | tee /tmp/hardening-benchmark.json
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-hardening-evidence
          path: |
            /tmp/hardening-before.txt
            /tmp/hardening-benchmark.json
      - name: Commit verified patch to this work branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/agent-hardening-20260917'
          rm scripts/_agent_hardening_patch.py .github/workflows/_agent-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: verify native postconditions and preserve projected contracts; avoid quadratic old-board scans'
          git push origin HEAD:refs/heads/codex/agent-hardening-20260917
