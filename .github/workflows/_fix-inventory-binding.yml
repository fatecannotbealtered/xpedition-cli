name: Correct and verify metadata binding
on:
  push:
    branches: [codex/readonly-api-inventory-20260918]
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/readonly-api-inventory-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: python -m pip install -e '.[dev]'
      - run: |
          python scripts/_fix_inventory_binding.py
          ruff check --select I --fix xpedition_cli/api_inventory.py tests/test_api_inventory.py
          ruff format xpedition_cli/api_inventory.py tests/test_api_inventory.py
      - name: Verify complete suite and unchanged gates
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q --junitxml=/tmp/binding.xml | tee /tmp/binding-tests.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
          python - <<'PY'
          import hashlib, json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          rows = list(ET.parse('/tmp/binding.xml').getroot().iter('testsuite'))
          data = {'run_id': os.environ['GITHUB_RUN_ID'],
                  'full_suite': {k: sum(int(s.get(k, 0)) for s in rows) for k in ('tests','failures','errors','skipped')},
                  'loader': 'pythoncom.LoadTypeLib with resolved absolute file path; no registration',
                  'ruff': 'passed', 'version_sync': 'passed', 'contract_local_only': 'passed',
                  'real_windows_smoke': 'separate workflow; not claimed by this Linux run',
                  'xpedition_executed': False,
                  'source_sha256': hashlib.sha256(Path('xpedition_cli/api_inventory.py').read_bytes()).hexdigest()}
          Path('docs/API_INVENTORY_BINDING_VALIDATION.json').write_text(json.dumps(data, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-inventory-binding-evidence
          path: |
            /tmp/binding.xml
            /tmp/binding-tests.txt
      - name: Commit only verified correction on review branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/readonly-api-inventory-20260918'
          rm scripts/_fix_inventory_binding.py .github/workflows/_fix-inventory-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: use actual pywin32 metadata loader with absolute-path nonregistration'
          git push origin HEAD:refs/heads/codex/readonly-api-inventory-20260918
