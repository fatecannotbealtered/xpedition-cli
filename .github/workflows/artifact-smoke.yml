# Exercise the release artifact transport and the checksum contract that
# release.yml's publish job depends on, without building a binary or
# publishing anything.
#
# Why it is built this way: release.yml runs only on a v*.*.* tag, so nothing
# else proves the upload/download pairing and the checksum merge still work
# after a bump to the artifact actions. This workflow therefore reuses
# release.yml's own packaging and merge scripts, on real runners of both
# families, with the same artifact name, upload path and download inputs.
# Only the payload is synthetic: a few bytes instead of a PyInstaller binary.
#
# Keep the mirrored bits mirrored. A fixture faked on the wrong runner, or an
# assertion written against an invented layout, yields a test that passes
# while the release breaks.
name: Release artifact smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/package-release-archive.ps1"
      - "scripts/prepare-release-assets.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/package-release-archive.ps1"
      - "scripts/prepare-release-assets.sh"

permissions:
  contents: read

concurrency:
  group: artifact-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package synthetic archive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # One Linux and one real Windows runner. That pair covers what the
        # transport can actually get wrong -- tar.gz vs zip, the two upload
        # clients, and the checksum file's line endings. The release matrix's
        # remaining runners (arm64, macOS) take the same branch of the
        # packaging script as ubuntu-24.04 does.
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Stands in for release.yml's "Build binary" step. Written through
      # .NET so the payload is byte-identical on both runners.
      - name: Create synthetic build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = if ("${{ runner.os }}" -eq "Windows") { "xpedition-cli.exe" } else { "xpedition-cli" }
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/$name"),
            "Synthetic fixture for the artifact smoke test. Not a release binary.`n"
          )

      # release.yml's real packaging step.
      - name: Package release archive
        shell: pwsh
        run: ./scripts/package-release-archive.ps1 -RunnerOs "${{ runner.os }}" -RunnerArch "${{ runner.arch }}"

      # Same name and path as release.yml's upload.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "xpedition-cli-${{ matrix.os }}"
          path: release/*
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: Merge and verify checksums
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Same inputs as release.yml: no name and no merge-multiple, so every
      # artifact lands in its own named directory. digest-mismatch is left at
      # the v8 default (error) instead of being set here, so this step keeps
      # matching the release path even if that default ever changes.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist

      # release.yml's real merge step. Its own `sha256sum -c` is what proves
      # the archives survived the roundtrip byte for byte.
      - name: Prepare release assets
        shell: bash
        run: bash scripts/prepare-release-assets.sh

      - name: Assert the release contract
        shell: bash
        run: |
          set -euo pipefail
          # Per-artifact named directories, i.e. merge-multiple stayed off.
          test -d "release-dist/xpedition-cli-ubuntu-24.04"
          test -d "release-dist/xpedition-cli-windows-2022"
          # Both archive formats reached the publish set.
          ls release/*.tar.gz >/dev/null
          ls release/*.zip >/dev/null
          # One checksum line per packaging job.
          test "$(grep -c . release/checksums.txt)" -eq 2
          # No stray CR: a trailing CR makes the filename unmatchable, and
          # users and self-update run SHA-256 verification against this
          # merged file. Tested through od so the answer cannot depend on
          # whether grep happened to open the file in text mode -- `grep -q
          # $'\r'` silently passes on a CRLF file under MSYS grep.
          if od -c release/checksums.txt | grep -q '\\r'; then
            echo "checksums.txt contains CR; packaging must write LF" >&2
            exit 1
          fi
          echo "PASS: real-runner upload (v7) -> download (v8), named dirs, LF checksums verified."
