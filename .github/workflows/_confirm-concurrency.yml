name: Apply and verify confirmation concurrency
on:
  push:
    branches: [codex/confirmation-concurrency-20260918]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'fatecannotbealtered/xpedition-cli' && github.ref == 'refs/heads/codex/confirmation-concurrency-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Reproduce selected public-boundary regressions on the baseline
        run: |
          set +e
          pytest -q tests/test_confirm_concurrency.py -k 'one_token_has_one_winner or distinct_concurrent_tokens or concurrent_first_use or alternate_base64_spelling' --junitxml=/tmp/confirm-before.xml > /tmp/confirm-before.txt 2>&1
          STATUS=$?
          tail -45 /tmp/confirm-before.txt
          test "$STATUS" -eq 1
      - name: Apply source-hash-pinned patch and format touched files
        run: |
          python scripts/_confirm_concurrency_patch.py
          ruff check --select I --fix xpedition_cli/confirm.py xpedition_cli/confirmation_store.py tests/test_confirm_concurrency.py tests/test_confirm_cli.py
          ruff format xpedition_cli/confirm.py xpedition_cli/confirmation_store.py tests/test_confirm_concurrency.py tests/test_confirm_cli.py
      - name: Run full suite and unchanged quality guards
        run: |
          set -euo pipefail
          ruff check xpedition_cli tests
          ruff format --check xpedition_cli tests
          pytest -q --junitxml=/tmp/confirm-after.xml | tee /tmp/confirm-after.txt
          node scripts/check-version.js
          node scripts/check-spec.js --local-only
          python - <<'PY'
          import hashlib, json, os, platform, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          def counts(name):
              suites = list(ET.parse(name).getroot().iter('testsuite'))
              return {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          data = {'baseline': 'd42b226a5b1812b2937ded096bf618b8692c4f9a',
                  'run_id': os.environ['GITHUB_RUN_ID'], 'python': sys.version,
                  'platform': platform.platform(), 'baseline_selected': counts('/tmp/confirm-before.xml'),
                  'full_suite': counts('/tmp/confirm-after.xml'),
                  'ruff': 'passed', 'version_sync': 'passed', 'contract_local_only': 'passed',
                  'native_xpedition_executed': False,
                  'limits': ['healthy local store; cooperating versions', 'storage degradation remains permitted',
                             'not a project write lock or exactly-once native execution'],
                  'source_sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in
                      ('xpedition_cli/confirm.py', 'xpedition_cli/confirmation_store.py',
                       'tests/test_confirm_concurrency.py', 'tests/test_confirm_cli.py')}}
          Path('docs/CONFIRMATION_CONCURRENCY_VALIDATION.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: confirmation-concurrency-evidence
          path: |
            /tmp/confirm-before.txt
            /tmp/confirm-before.xml
            /tmp/confirm-after.txt
            /tmp/confirm-after.xml
      - name: Commit verified patch on this review branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/confirmation-concurrency-20260918'
          rm scripts/_confirm_concurrency_patch.py .github/workflows/_confirm-concurrency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: serialize confirmation consumption and reject alternate token encodings'
          git push origin HEAD:refs/heads/codex/confirmation-concurrency-20260918
